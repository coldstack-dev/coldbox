[Service]
TimeoutStopSec=11min
ExecStopPost=:/bin/sh -c 'if [ "$SERVICE_RESULT" != success ]; then echo "deployed check failed ($SERVICE_RESULT)" >&2; fi; \
    /usr/local/bin/coldbox status --hosts; fleet_status=$?; \
    if [ "$fleet_status" -ne 0 ]; then echo "fleet status failed (exit $fleet_status)" >&2; fi; exit "$fleet_status"'
